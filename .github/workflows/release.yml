name: Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check code
        run: |
          test "$(uname -m)" = arm64
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and verify DMG
        run: |
          sh scripts/build-dmg.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ChooBro.app/Contents/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --draft --prerelease \
            --title "ChooBro $GITHUB_REF_NAME (Preview)" \
            --notes-file resources/INSTALL.txt \
            dist/*.dmg dist/*.dmg.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
