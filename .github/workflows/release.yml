name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check code
        run: |
          test "$(uname -m)" = arm64
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          ruby scripts/test-update-cask.rb
      - name: Build and verify DMG
        run: |
          sh scripts/build-dmg.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ChooBro.app/Contents/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --prerelease \
            --title "ChooBro $RELEASE_TAG (Preview)" \
            --notes-file resources/INSTALL.txt \
            dist/*.dmg dist/*.dmg.sha256
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ChooBro.app/Contents/Info.plist)
          checksum=$(shasum -a 256 "dist/ChooBro-$version-macos-arm64.dmg" | awk '{print $1}')
          ruby scripts/update-cask.rb "$version" "$checksum"
