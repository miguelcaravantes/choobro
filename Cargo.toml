[package]
name = "choobro"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "A native macOS browser chooser"
repository = "https://github.com/miguelcaravantes/choobro"

[[example]]
name = "native-smoke"
test = false

[dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSAccessibility", "NSAccessibilityProtocols", "NSAlert", "NSApplication", "NSButton",
    "NSBitmapImageRep", "NSImageRep", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSImage", "NSImageView",
    "NSLayoutConstraint", "NSLayoutAnchor", "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSResponder",
    "NSRunningApplication", "NSScrollView", "NSClipView", "NSStackView",
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSTableCellView",
    "NSTableColumn", "NSTableView", "NSTableHeaderView", "NSText", "NSTextField", "NSUserInterfaceLayout",
    "NSView", "NSWindow", "NSWorkspace", "NSGraphics", "NSUserInterfaceItemIdentification",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSGeometry",
    "NSIndexSet", "NSNotification", "NSObjCRuntime", "NSObject", "NSOperation", "NSString", "NSURL",
    "NSUserDefaults", "NSValue",
] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
